  # portaleaste: rimosso dalla review finale del branch fase2. Verificato
  # per confronto lot-ID sui fixture reali: portaleaste.com e asteimmobili.it
  # condividono lo stesso data source sottostante (Astalegale.net) e
  # restituiscono i 5 stessi lotti (stessi ID, prezzi, URL) — 0 annunci
  # unici da portaleaste, tutti gia' inclusi anche in astegiudiziarie. Il
  # modulo resta registrato in scraper/run_all.py's PORTAL_MODULES, solo
  # disattivato qui per evitare duplicati.
  # immobiliare, idealista: NON attivi e NON attivabili qui. Bloccati da
  # anti-bot DataDome (vedi scraper/immobiliare.py, scraper/idealista.py,
  # docs/superpowers/reports/task-8-immobiliare-antibot-report.md,
  # docs/superpowers/reports/task-9-idealista-antibot-report.md) — non fanno
  # parte della pipeline automatica giornaliera (run_all/scripts.daily).
  # Percorso separato, manuale: scripts/apri_ricerche_manuali.py apre le
  # pagine di ricerca nel browser vero dell'utente (bypassa l'anti-bot: e'
  # navigazione umana reale, non uno script), l'utente salva con Ctrl+S,
  # poi scripts/importa_ricerche_manuali.py legge i file salvati e li importa
  # nello stesso DB/sito degli altri portali.
